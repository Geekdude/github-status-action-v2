name: 'github-status-action-v2'
description: 'Adds a check status on a commit, GitHub reports the last status added for a particular context.'
author: 'GuiBranco'
branding:
  icon: 'check'  
  color: 'green'
inputs:
  authToken:
    description: 'Use secrets.GITHUB_TOKEN or your own token if you need to trigger other workflows the use "on: status"'
    required: true  
  state:
    description: 'The status of the check: success, error, failure, pending, or cancelled (mapped to error, since GitHub has no cancelled state)'
    required: true
  context:
    description: 'The context, this is displayed as the name of the check'
    default: 'default'
    required: false
  description:
    description: 'Short text explaining the status of the check'
    default: ''
    required: false
  owner:
    description: 'Repository owner, defaults to context github.repository_owner if omitted'
    default: ${{ github.repository_owner }}
    required: false
  repository:
    description: 'Repository, default to context github.repository if omitted'
    default: ${{ github.repository }}
    required: false
  sha:
    description: 'SHA of commit to update status on, defaults to context github.sha'
    default: ${{ github.sha }}
    required: false
  target_url:
    description: 'URL/URI to use for further details.'
    required: false
  retries:
    description: 'Number of retries after a failed attempt, up to retries + 1 requests in total, as with curl --retry N. Only transient failures (network, timeout, 408, rate-limited 403, 429, 5xx) are retried; all other 4xx responses fail immediately. Must be between 0 and 10; out-of-range values fall back to the default'
    default: '3'
    required: false
  retryDelaySeconds:
    description: 'Delay in seconds between retry attempts, 0 for no delay. Must be between 0 and 300; out-of-range values fall back to the default'
    default: '5'
    required: false
  timeoutSeconds:
    description: 'Per-attempt request timeout in seconds. Must be between 1 and 300; out-of-range values fall back to the default'
    default: '30'
    required: false
runs:
  using: 'node24'
  main: 'dist/index.js'
